services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oxide_monitor
      POSTGRES_USER: oxide
      POSTGRES_PASSWORD: oxide_dev
    ports:
      - "55432:5432"
    volumes:
      - oxide_candidate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxide -d oxide_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  simulator:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["node", "simulator/server.js"]
    ports:
      - "8788:8788"

  app:
    build: .
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://oxide:oxide_dev@postgres:5432/oxide_monitor
      BOT_SIMULATOR_URL: http://simulator:8788
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started

volumes:
  oxide_candidate_pg:
